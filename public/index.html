<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Browser</title>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 0; }
  #controls { margin: 20px; }
  #screen { border: 1px solid #ccc; touch-action: none; }
</style>
</head>
<body>

<div id="controls">
  <input type="text" id="url" placeholder="Enter URL" size="40">
  <button id="go">Go</button>
</div>
<img id="screen" width="1280" height="720" alt="Remote Browser Screen">

<script>
let sessionId = null;
const screen = document.getElementById('screen');
const urlInput = document.getElementById('url');

async function createSession(url) {
  const res = await fetch('/api/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url })
  });
  const data = await res.json();
  sessionId = data.sessionId;
  updateScreen();
}

async function navigate(url) {
  if (!sessionId) await createSession(url);
  else {
    await fetch('/api/navigate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, url })
    });
  }
}

async function updateScreen() {
  if (!sessionId) return;
  const img = `/api/screenshot/${sessionId}?_=${Date.now()}`;
  screen.src = img;
  setTimeout(updateScreen, 1000); // refresh every second
}

document.getElementById('go').addEventListener('click', () => {
  const url = urlInput.value;
  if (url) navigate(url);
});

// Support drag for mouse simulation
let dragging = false;
screen.addEventListener('pointerdown', e => dragging = true);
screen.addEventListener('pointerup', e => dragging = false);
screen.addEventListener('pointermove', e => {
  if (!dragging) return;
  // You can send drag coordinates to server for mouse simulation
  // Example: fetch('/api/mouse', { method:'POST', body: JSON.stringify({x:e.offsetX, y:e.offsetY})})
});

</script>
</body>
</html>
